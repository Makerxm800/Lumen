name: Build and release Lumen

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (without the leading v)
        required: true
        default: '1.4.0'
        type: string
      publish_release:
        description: Create a public GitHub Release after all platform builds pass
        required: true
        default: false
        type: boolean
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'Lumen Player/electron/**'
      - 'Lumen Player/renderer/**'
      - 'Lumen Player/package.json'
      - 'Lumen Player/package-lock.json'
      - 'Lumen Player/prepare_runtime.ps1'
      - 'Lumen Player/icon.ico'
      - '.github/workflows/release.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            asset: Windows-x64
            platform: win
            arch: x64
          - runner: macos-15
            asset: macOS-arm64
            platform: mac
            arch: arm64
          - runner: macos-15-intel
            asset: macOS-x86_64
            platform: mac
            arch: x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: Lumen Player
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Lumen Player/package-lock.json

      - name: Prepare portable mpv runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./prepare_runtime.ps1

      - name: Install dependencies
        run: npm ci

      - name: Test Electron app
        run: npm test

      - name: Package Windows app
        if: matrix.platform == 'win'
        run: npm run dist -- --win zip --x64

      - name: Package macOS app
        if: matrix.platform == 'mac'
        run: npm run dist -- --mac zip dmg --${{ matrix.arch }}

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.asset }}" in
            Windows-x64) test -s dist/Lumen-Windows-x64.zip ;;
            macOS-arm64) test -s dist/Lumen-macOS-arm64.zip; test -s dist/Lumen-macOS-arm64.dmg ;;
            macOS-x86_64) test -s dist/Lumen-macOS-x64.zip; test -s dist/Lumen-macOS-x64.dmg ;;
          esac

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumen-${{ matrix.asset }}
          path: Lumen Player/dist/Lumen-*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Lumen-*
          path: release-assets
          merge-multiple: true
      - name: Create release and attach Windows/macOS builds
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', inputs.version) }}
          name: Lumen ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', inputs.version) }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release-assets/*
